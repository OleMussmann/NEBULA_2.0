project:
  type: website
  output-dir: _site
  pre-render: python3 prepare.py
  render:
    - index.qmd
    - poc.qmd
    - main/*.md
    - modules/*/*.md
  resources:
    - modules/*/*.deck.html
    - modules/*/media/**

# Navbar entries for main/ pages, generated by prepare.py
metadata-files:
  - _generated.yml

website:
  title: "Research Software Support"
  site-url: https://olemussmann.github.io/NEBULA_2.0/quarto/
  repo-url: https://github.com/OleMussmann/NEBULA_2.0
  repo-subdir: content
  repo-branch: main
  repo-actions: [edit]
  search: true
  navbar:
    right:
      - href: poc.qmd
        text: About this PoC
  page-footer:
    left: >
      Lesson content © Netherlands eScience Center,
      [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) (images: see credits);
      source: [research-software-support](https://github.com/esciencecenter-digital-skills/research-software-support).
    right: "Quarto variant of the [NEBULA successor PoC](https://github.com/OleMussmann/NEBULA_2.0)"

format:
  html:
    # NEBULA content is CommonMark (reveal.js uses marked, NEBULA Nuxt
    # Content). Pandoc's own Markdown differs, e.g. indented lines inside
    # HTML blocks become code blocks.
    from: commonmark_x
    theme:
      light: cosmo
      dark: darkly
    css:
      - _shared/study.css
      - styles.css
    toc: true
